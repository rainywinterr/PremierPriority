<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Alice Sushi | Premium Gastronomy</title>
    <meta name="description" content="Découvrez nos créations raffinées de sushis, maki, nigiri et boxes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>
    <div id="welcome-overlay" class="welcome-overlay">
        <div class="welcome-content">
            <h1 class="welcome-title">Alice Sushi</h1>
            <button id="enter-fullscreen-btn" class="welcome-enter-btn">
                <span>Menu</span>
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <div id="menu-view" class="menu-view-container hidden-slide">
        <header id="top-menu-header" class="top-menu-header">
            <div class="top-menu-row">
                <div class="top-left-controls">
                    <button id="category-dropdown-btn" class="control-btn" title="Choisir catégorie">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <button id="view-toggle-btn" class="control-btn" title="Changer la vue">
                        <svg id="icon-scroll" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <line x1="3" y1="15" x2="21" y2="15"></line>
                        </svg>
                        <svg id="icon-grid" class="hidden-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                        </svg>
                    </button>
                </div>
                <div id="current-subcat-display" class="current-subcat-name"></div>
            </div>
        </header>

        <div id="category-dropdown-list" class="category-dropdown-list hidden"></div>

        <div id="vertical-scroll-nav" class="vertical-scroll-nav">
            <button id="scroll-arrow-up" class="scroll-arrow-btn arrow-up" title="Précédent">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </button>
            <nav id="sub-nav" class="vertical-sub-nav-dots"></nav>
            <button id="scroll-arrow-down" class="scroll-arrow-btn arrow-down" title="Suivant">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>

        <div class="snap-container" id="snap-container"></div>

        <div id="grid-view-container" class="grid-view-container hidden">
            <div id="horizontal-grid-nav" class="horizontal-grid-nav hidden">
                <button id="scroll-arrow-left" class="scroll-arrow-btn arrow-left" title="Précédent">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <nav id="grid-sub-nav" class="horizontal-sub-nav-dots"></nav>
                <button id="scroll-arrow-right" class="scroll-arrow-btn arrow-right" title="Suivant">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 6 15 12 9 18"></polyline>
                    </svg>
                </button>
            </div>
            <div id="grid-swipe-container" class="grid-swipe-container"></div>
        </div>

        <div id="bg-masks-container"></div>
    </div>

    <button id="fab-order" class="hidden" title="Voir la commande">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span id="order-count-badge">0</span>
    </button>

    <div id="order-modal" class="order-modal hidden">
        <div class="order-modal-inner">
            <div class="order-modal-header">
                <span>Order List</span>
                <button id="order-modal-close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="order-list" class="order-list"></div>
            <div class="order-modal-footer">
                <div id="order-total" class="order-total">Total: 0 DA</div>
                <button id="order-submit" disabled>Send to Kitchen</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
